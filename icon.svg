<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Blue radial gradient for the circle -->
    <radialGradient id="circleGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#1A5FCC"/>
    </radialGradient>
    <!-- Drop shadow filter for the hook -->
    <filter id="hookShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
  </defs>

  <!-- Blue circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#circleGrad)"/>

  <!-- Hook shape: white, with drop shadow bottom-right -->
  <!-- Hook = vertical bar curving into a J shape with a barb at the top -->
  <g filter="url(#hookShadow)">
    <path
      d="
        M 64 28
        C 64 28, 82 28, 82 46
        C 82 62, 64 64, 64 80
        L 64 92
        M 64 92
        L 56 84
        M 64 92
        L 72 84
      "
      fill="none"
      stroke="white"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Barb/tip at top of hook -->
    <path
      d="M 64 28 L 56 36"
      fill="none"
      stroke="white"
      stroke-width="9"
      stroke-linecap="round"
    />
  </g>
</svg>
